[project]
name = "clinical-coding-x"
version = "0.1.0"
description = "Clinical coding automation with text normalization, concept extraction, and question generation"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=5.0.0",
    "litellm>=1.80.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/shared",
    "src/coding_orchestrator",
    "src/text_normalizer",
    "src/concept_extractor",
    "src/question_generator",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "grpcio-testing>=1.60.0",
]

[project.scripts]
text-normalizer = "text_normalizer.__main__:main"
